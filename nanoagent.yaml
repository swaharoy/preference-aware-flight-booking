_ > nanoagent.plugin.v0001.ManifestConfig:
id: preference-aware-flight-booking
name: Preference-Aware Flight Booking
version: 0.1.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  booking_requirements:
    description: What a booking request must give (traveller, airports, travel date, and a seat, time and stops preference each with a weight, the weights adding up to 100), with examples, what each preference means and the airports to choose from
  get_trip:
    description: Begin a booking run for a trip request, booked as of today, and show the trip with the traveller's preferences and weights
  search_flights:
    description: List the one-way offers on a route on a day, with airline, flight numbers, local departure and arrival, stops, total minutes, day or red-eye, the seat types still open and the fare (simulated fares and schedules)
  solve_booking:
    description: The answer key, never given to the agent - the bookings that best fit a trip request's weighted preferences, as of today

# One entry per contract.Task; its input and output classes are contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  booking-requirements:
    description: Show what to tell us to book a flight, what each preference means, and the airports to choose from
    runner: tool
    tools: [booking_requirements]
    reference: null
    instructions: Call booking_requirements with topic ALL (FIELDS for only what to tell us, AIRPORTS for only the airport list) and show what it returns.
  search-flights:
    description: Show the flight offers on a route and day
    runner: tool
    tools: [search_flights]
    reference: null
    instructions: Call search_flights with an empty run_id, the route's airport codes and the travel date (today or later), and show the offers it returns.
  preference-aware-flight-booking:
    description: Book the one-way flight and seat that best fit a traveller's weighted seat, time and stop preferences
    runner: agent
    tools: [get_trip, search_flights]
    reference: solve_booking
    instructions: |-
      Book one one-way flight, and a seat on it, that best fits the traveller's weighted preferences. Money is in US cents. Fares, schedules and seats are simulated.
      Plan: exactly three tool calls. (1) get_trip with the task input exactly as given; it returns run_id and the trip with its three preferences and their weights (they add up to 100). (2) search_flights with that run_id, the trip's origin and destination codes, and its travel_date, as given. (3) submit.
      A booking is one offer and one seat type from that offer's open_seats (WINDOW, AISLE or MIDDLE). Its score is the sum of:
      - seat_weight if the seat equals seat_preference (MIDDLE never does);
      - time_weight if the offer's time_of_day equals time_preference;
      - stops_weight if stops_preference is NONSTOP and the offer's stops is 0, or it is CONNECTING and stops is 1 or more.
      Rules:
      P1. The booking must reach the highest score of any offer and open seat on the day's offers.
      P2. Among the offers that can reach that score, book one with the lowest fare_cents (any of them when tied), with an open seat that reaches the score.
      Nothing else counts: not total_minutes, not the airline, and fare only as in P2.
      Submit: run_id as get_trip returned it; offer_id; seat. Reason briefly; do not call any tool after submit.
